name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip check
      - name: Compile Python
        run: python -m compileall -q .
      - name: V4.2 local security regression
        run: python audit/regression_security_v42.py
      - name: V4.2 full hardening regression
        run: python audit/regression_v42_full.py
      - name: V4.3 storyboard scheduler regression
        run: python audit/regression_v43_storyboard_scheduler.py
      - name: V4.5.2 player QoS contracts
        run: python audit/regression_v452_player_qos.py
      - name: V4.5.2 frontend player QoS gate
        run: node audit/regression_v452_frontend_qos.cjs
      - name: V4.3 grouped feed fast-path regression
        run: python audit/regression_v43_grouped_fast.py
      - name: Consolidated audit-fix regressions
        run: python audit/regression_audit_fixes.py
      - name: Core backend regression
        run: python audit/regression_checks.py
      - name: Frontend regression
        run: node audit/regression_frontend.cjs
      - name: Accessibility and player-controls regression
        run: node audit/regression_accessibility.cjs
      - name: Home loading regression
        run: node audit/regression_home_loading.cjs
      - name: V4.3 home scope guard
        run: python audit/regression_v43_home_scope.py
      - name: Block without reload regression
        run: node audit/regression_block_no_reload.cjs
      - name: Pagination regression
        run: node audit/regression_pagination.cjs
      - name: Search filter regression
        run: node audit/regression_search_filters.cjs
      - name: Local search scope regression
        run: node audit/regression_local_search.cjs
      - name: Search backend pagination regression
        run: python audit/regression_search_pagination.py
      - name: Storyboard client regression
        run: node audit/regression_storyboard_client.cjs
      - name: V4.3 modal storyboard identity regression
        run: node audit/regression_v43_modal_identity.cjs
      - name: Storyboard shared-segment regression
        run: node audit/regression_storyboard_cross_tab.cjs
      - name: Storyboard package-D frontend regression
        run: node audit/regression_package_d_frontend.cjs
      - name: Catalog partial frontend regression
        run: node audit/regression_catalog_partial_frontend.cjs
      - name: Feed regression
        run: python audit/regression_feed.py
      - name: Catalog bootstrap regression
        run: python audit/regression_catalog_bootstrap.py
      - name: Catalog durable resume regression
        run: python audit/regression_catalog_resume.py
      - name: Catalog transient source resume regression
        run: python audit/regression_catalog_transient_resume.py
      - name: Catalog revision monotonicity regression
        run: python audit/regression_catalog_revision_monotonicity.py
      - name: Latest-only sparse migration scope regression
        run: python audit/regression_latest_sparse_migration_scope.py
      - name: Archivebate sparse pagination regression
        run: python audit/regression_archivebate_sparse_pagination.py
      - name: Deep Archivebate discovery regression
        run: python audit/regression_deep_archivebate.py
      - name: V4.1 catalog concurrency regression
        run: python audit/regression_catalog_v41.py
      - name: Camwhores sparse pagination regression
        run: python audit/regression_camwhores_sparse_pagination.py
      - name: Legacy resume cursor regression
        run: python audit/regression_legacy_resume_cursor.py
      - name: Archivebate true-end regression
        run: python audit/regression_archivebate_true_end.py
      - name: Archivebate source-limit regression
        run: python audit/regression_archivebate_source_limit.py
      - name: Grouped feed batch-query regression
        run: python audit/regression_grouped_query_batch.py
      - name: Catalog read concurrency regression
        run: python audit/regression_catalog_read_concurrency.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Storyboard package-D regression
        run: python audit/regression_package_d.py
      - name: Unit tests
        run: python -m unittest test_suite -q

  windows-contracts:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip check
      - name: Secret and destructive-launch negative controls
        shell: pwsh
        run: |
          $hits = @(git grep -n -I -E 'taskkill[[:space:]]+/|ARCHIVEBATE_(EMAIL|PASSWORD)[[:space:]]*=' -- . ':!README.md' ':!USTAW_KONTO.bat' ':!audit/**')
          if ($LASTEXITCODE -gt 1) { throw 'git grep failed while scanning for destructive launch commands or credentials' }
          $realHits = @($hits | Where-Object {
            $_ -notmatch 'twoje_haslo|twoj_email@example\.com'
          })
          if ($realHits.Count -gt 0) { $realHits | Write-Error; exit 1 }
      - name: Compile Python
        run: python -m compileall -q .
      - name: V4.2 local security regression
        run: python audit/regression_security_v42.py
      - name: V4.2 full hardening regression
        run: python audit/regression_v42_full.py
      - name: V4.3 storyboard scheduler regression
        run: python audit/regression_v43_storyboard_scheduler.py
      - name: V4.5.2 player QoS contracts
        run: python audit/regression_v452_player_qos.py
      - name: V4.5.2 frontend player QoS gate
        run: node audit/regression_v452_frontend_qos.cjs
      - name: V4.3 grouped feed fast-path regression
        run: python audit/regression_v43_grouped_fast.py
      - name: Next-generation contract regression
        run: python audit/regression_next_generation.py
      - name: Consolidated audit-fix regression
        run: python audit/regression_audit_fixes.py
      - name: Active frontend regression
        run: node audit/regression_frontend.cjs
      - name: Accessibility and player-controls regression
        run: node audit/regression_accessibility.cjs
      - name: V4.3 modal storyboard identity regression
        run: node audit/regression_v43_modal_identity.cjs
      - name: Storyboard package-D frontend regression
        run: node audit/regression_package_d_frontend.cjs
      - name: Pagination frontend regression
        run: node audit/regression_package_b_frontend.cjs
      - name: Catalog projection frontend regression
        run: node audit/regression_catalog_partial_frontend.cjs
      - name: Local search scope regression
        run: node audit/regression_local_search.cjs
      - name: Unit tests
        run: python -m unittest -v test_suite.py

  windows-python314:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip check
      - name: Compile Python
        run: python -m compileall -q .
      - name: V4.2 local security regression
        run: python audit/regression_security_v42.py
      - name: V4.2 full hardening regression
        run: python audit/regression_v42_full.py
      - name: V4.3 storyboard scheduler regression
        run: python audit/regression_v43_storyboard_scheduler.py
      - name: V4.5.2 player QoS contracts
        run: python audit/regression_v452_player_qos.py
      - name: V4.5.2 frontend player QoS gate
        run: node audit/regression_v452_frontend_qos.cjs
      - name: V4.3 grouped feed fast-path regression
        run: python audit/regression_v43_grouped_fast.py
      - name: V4.1 catalog concurrency regression
        run: python audit/regression_catalog_v41.py
      - name: Active frontend regression
        run: node audit/regression_frontend.cjs
      - name: Accessibility and player-controls regression
        run: node audit/regression_accessibility.cjs
      - name: V4.3 modal storyboard identity regression
        run: node audit/regression_v43_modal_identity.cjs
      - name: Storyboard package-D frontend regression
        run: node audit/regression_package_d_frontend.cjs
      - name: Unit tests
        run: python -m unittest -v test_suite.py
