name: Deep Archivebate depth-first hotfix

on:
  push:
    branches: [master]
    paths:
      - _apply_deep_depth_fix.py
      - .github/workflows/deep-depth-hotfix.yml

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply guarded hotfix
        run: python _apply_deep_depth_fix.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Deep Archivebate regression
        run: python audit/regression_deep_archivebate.py
      - name: Archivebate sparse pagination regression
        run: python audit/regression_archivebate_sparse_pagination.py
      - name: Catalog monotonicity regression
        run: python audit/regression_catalog_revision_monotonicity.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Frontend regression
        run: node audit/regression_frontend.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit qualified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deep_archivebate.py audit/regression_deep_archivebate.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: prioritize deep Archivebate profile progress"
          git push origin HEAD:master
