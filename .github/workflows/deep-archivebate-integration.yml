name: Deep Archivebate integration

on:
  push:
    branches: [master]
    paths:
      - tools/apply_deep_archivebate_integration.py
      - .github/workflows/deep-archivebate-integration.yml

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply guarded integration
        run: python tools/apply_deep_archivebate_integration.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Deep Archivebate regression
        run: python audit/regression_deep_archivebate.py
      - name: Catalog monotonicity regression
        run: python audit/regression_catalog_revision_monotonicity.py
      - name: Archivebate sparse pagination regression
        run: python audit/regression_archivebate_sparse_pagination.py
      - name: Archivebate source-limit regression
        run: python audit/regression_archivebate_source_limit.py
      - name: Catalog durable resume regression
        run: python audit/regression_catalog_resume.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Main import smoke test
        run: python -c "import main; from deep_archivebate import deep_archivebate_service; assert isinstance(deep_archivebate_service.status(), dict); print('PASS main/deep import')"
      - name: Frontend regression
        run: node audit/regression_frontend.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit qualified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: start durable Deep Archivebate crawler"
          git push origin HEAD:master
