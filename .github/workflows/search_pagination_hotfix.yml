name: Search pagination hotfix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused search fix
        run: python tools/apply_search_pagination_fix.py
      - name: Normalize regression import path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('audit/regression_search_pagination.py')
          text = p.read_text(encoding='utf-8')
          anchor = "from unittest.mock import patch\n\nfrom scraper import ArchivebateScraper\n"
          replacement = "from pathlib import Path\nimport sys\nfrom unittest.mock import patch\n\nROOT = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(ROOT))\n\nfrom scraper import ArchivebateScraper\n"
          if anchor not in text:
              raise SystemExit('regression import anchor missing')
          p.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Search filter regression
        run: node audit/regression_search_filters.cjs
      - name: Search backend pagination regression
        run: python audit/regression_search_pagination.py
      - name: Existing frontend pagination regression
        run: node audit/regression_pagination.cjs
      - name: Consolidated audit-fix regressions
        run: python audit/regression_audit_fixes.py
      - name: Core backend regression
        run: python audit/regression_checks.py
      - name: Frontend regression
        run: node audit/regression_frontend.cjs
      - name: Storyboard client regression
        run: node audit/regression_storyboard_client.cjs
      - name: Storyboard cross-tab regression
        run: node audit/regression_storyboard_cross_tab.cjs
      - name: Catalog partial frontend regression
        run: node audit/regression_catalog_partial_frontend.cjs
      - name: Feed regression
        run: python audit/regression_feed.py
      - name: Catalog bootstrap regression
        run: python audit/regression_catalog_bootstrap.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Storyboard package-D regression
        run: python audit/regression_package_d.py
      - name: Unit tests
        run: python -m unittest test_suite -q
      - name: Finalize qualified hotfix
        run: |
          git rm tools/apply_search_pagination_fix.py .github/workflows/search_pagination_hotfix.yml
          git config user.name 'eagleblastmusic-lgtm'
          git config user.email 'eagleblastmusic@gmail.com'
          git add scraper.py static/filters.js audit/regression_search_filters.cjs audit/regression_search_pagination.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'fix: make search filters and grouped pagination deterministic'
          git push origin HEAD:master
