name: Catalog transient retry hotfix

on:
  push:
    branches: [master]
    paths:
      - tools/apply_transient_catalog_retry_fix.py
      - .github/workflows/catalog-transient-retry-hotfix.yml

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply guarded fix
        run: python tools/apply_transient_catalog_retry_fix.py
      - name: Fix generated regression import path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('audit/regression_catalog_transient_resume.py')
          text = p.read_text(encoding='utf-8')
          marker = 'import json\nimport tempfile\nfrom pathlib import Path\n\nfrom catalog_service import CatalogService\n'
          replacement = 'import json\nimport sys\nimport tempfile\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\nfrom catalog_service import CatalogService\n'
          assert text.count(marker) == 1
          p.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Compile Python
        run: python -m compileall -q .
      - name: Transient resume regression
        run: python audit/regression_catalog_transient_resume.py
      - name: Catalog durable resume regression
        run: python audit/regression_catalog_resume.py
      - name: Catalog revision monotonicity regression
        run: python audit/regression_catalog_revision_monotonicity.py
      - name: Camwhores sparse pagination regression
        run: python audit/regression_camwhores_sparse_pagination.py
      - name: Archivebate source limit regression
        run: python audit/regression_archivebate_source_limit.py
      - name: Deep Archivebate regression
        run: python audit/regression_deep_archivebate.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Frontend regression
        run: node audit/regression_frontend.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit qualified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_service.py audit/regression_catalog_transient_resume.py .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: resume transient catalog source failures"
          git push origin HEAD:master
