name: V4.2 Fix and Test

on:
  push:
    branches: [v4.2-security-runtime-hardening]
    paths:
      - tools/fix_v42_legacy.py
      - .github/workflows/v42-fix-and-test.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.2-security-runtime-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Migrate legacy regression expectations
        run: python tools/fix_v42_legacy.py
      - name: Persist compatibility migration
        run: |
          git add -A
          git commit -m "Align legacy regressions with V4.2 HTTP semantics"
          git push origin HEAD:v4.2-security-runtime-hardening
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip check
      - name: Run compatibility suite
        shell: bash
        run: |
          set +e
          {
            python audit/regression_audit_fixes.py
            python audit/regression_catalog_v41.py
            python -m unittest test_suite -q
          } > v42_compat_failure.log 2>&1
          rc=$?
          cat v42_compat_failure.log
          if [ "$rc" -ne 0 ]; then
            git add v42_compat_failure.log
            git commit -m "Record V4.2 compatibility failure"
            git push origin HEAD:v4.2-security-runtime-hardening
            exit "$rc"
          fi
          rm -f v42_compat_failure.log
