name: V4.2 Fix and Test

on:
  push:
    branches: [v4.2-security-runtime-hardening]
    paths:
      - tools/fix_v42_nextgen.py
      - .github/workflows/v42-fix-and-test.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.2-security-runtime-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Migrate next-generation storyboard expectations
        run: python tools/fix_v42_nextgen.py
      - name: Persist compatibility migration
        run: |
          git add -A
          git commit -m "Align next-generation regressions with V4.2 storyboard"
          git push origin HEAD:v4.2-security-runtime-hardening
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip check
      - name: Run compatibility suite
        run: |
          python audit/regression_next_generation.py
          python audit/regression_audit_fixes.py
          python audit/regression_archivebate_true_end.py
          python audit/regression_catalog_v41.py
          python -m unittest test_suite -q
