name: Archivebate empty-boundary hotfix

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tighten boundary condition
        run: python tools/adjust_archivebate_empty_boundary_fix.py
      - name: Apply hotfix
        run: python tools/apply_archivebate_empty_boundary_fix.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Archivebate source-limit regression
        run: python audit/regression_archivebate_source_limit.py
      - name: Archivebate true-end regression
        run: python audit/regression_archivebate_true_end.py
      - name: Legacy resume cursor regression
        run: python audit/regression_legacy_resume_cursor.py
      - name: Durable resume regression
        run: python audit/regression_catalog_resume.py
      - name: Grouped feed regression
        run: python audit/regression_grouped_query_batch.py
      - name: Catalog read concurrency regression
        run: python audit/regression_catalog_read_concurrency.py
      - name: Core backend regression
        run: python audit/regression_checks.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Frontend regression
        run: node audit/regression_frontend.cjs
      - name: Home loading regression
        run: node audit/regression_home_loading.cjs
      - name: Unit tests
        run: python -m unittest test_suite -q
      - name: Commit qualified hotfix
        run: |
          rm tools/apply_archivebate_empty_boundary_fix.py tools/adjust_archivebate_empty_boundary_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_service.py audit/regression_archivebate_source_limit.py tools/apply_archivebate_empty_boundary_fix.py tools/adjust_archivebate_empty_boundary_fix.py
          git diff --cached --check
          git commit -m "fix: classify Archivebate page-1001 empty boundary as limited"
          git push origin HEAD:master
