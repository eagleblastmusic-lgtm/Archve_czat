name: Catalog integrity hotfix

on:
  push:
    branches: [master]
    paths:
      - tools/apply_catalog_integrity_fix.py
      - .github/workflows/catalog-integrity-hotfix.yml

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply guarded patch
        run: python tools/apply_catalog_integrity_fix.py
      - name: Preserve active partial when no completed snapshot exists
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog_service.py")
          text = path.read_text(encoding="utf-8")
          old = '''                conn.execute("UPDATE revisions SET is_active = 0")
                best_complete = conn.execute(
                    "SELECT revision FROM revisions WHERE complete = 1 AND failed = 0 "
                    "ORDER BY revision DESC LIMIT 1"
                ).fetchone()
                if best_complete:
                    conn.execute(
                        "UPDATE revisions SET is_active = 1 WHERE revision = ?",
                        (int(best_complete["revision"]),),
                    )
'''
          new = '''                best_complete = conn.execute(
                    "SELECT revision FROM revisions WHERE complete = 1 AND failed = 0 "
                    "ORDER BY revision DESC LIMIT 1"
                ).fetchone()
                if best_complete:
                    conn.execute("UPDATE revisions SET is_active = 0")
                    conn.execute(
                        "UPDATE revisions SET is_active = 1 WHERE revision = ?",
                        (int(best_complete["revision"]),),
                    )
'''
          if text.count(old) != 1:
              raise SystemExit(f"active-normalization patch expected 1 match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Compile Python
        run: python -m compileall -q .
      - name: Revision monotonicity regression
        run: python audit/regression_catalog_revision_monotonicity.py
      - name: Camwhores sparse pagination regression
        run: python audit/regression_camwhores_sparse_pagination.py
      - name: Durable resume regression
        run: python audit/regression_catalog_resume.py
      - name: Legacy resume cursor regression
        run: python audit/regression_legacy_resume_cursor.py
      - name: Archivebate true-end regression
        run: python audit/regression_archivebate_true_end.py
      - name: Archivebate source-limit regression
        run: python audit/regression_archivebate_source_limit.py
      - name: Integration regression
        run: python audit/regression_integration.py
      - name: Diff check
        run: git diff --check
      - name: Commit qualified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_service.py audit/regression_catalog_revision_monotonicity.py audit/regression_camwhores_sparse_pagination.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize catalog resume and Camwhores pagination"
          git push origin HEAD:master
